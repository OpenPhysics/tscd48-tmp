name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Build & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
      # Call the build substeps directly instead of `npm run build`, which
      # re-runs `typecheck` internally - already done above in this job.
      - run: npm run build:unminified
      - run: npm run build:minified
      - run: npm run build:types
      - name: Verify outputs
        run: |
          test -f dist/cd48.esm.js
          test -f dist/cd48.umd.js
          test -f dist/cd48.esm.min.js
          test -f dist/cd48.umd.min.js
          test -f dist/index.d.ts
      - run: npm audit --production --audit-level=high

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    needs: [verify]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Examples import from dist/; without a build, module scripts fail and
      # CodeMirror never initializes (E2E waits on .CodeMirror forever).
      - run: npm run build:unminified
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: test-results/
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: OpenPhysics/relay/.github/workflows/shared-dependency-review.yml@main

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: OpenPhysics/relay/.github/workflows/shared-codeql.yml@main
